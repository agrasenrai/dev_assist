# Copy to /mnt/shiftweave/compose.yaml after reviewing UPDATE_CHECKLIST.md.
# Uses the EXISTING EBS directories supplied by the deployment owner.
# Run with: docker compose --env-file /mnt/shiftweave/.env.deploy -p shiftweave ...
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the newly tested ECR tag or digest}
    platform: linux/arm64
    env_file:
      - /mnt/shiftweave/.env.deploy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SQLITE_DB_PATH: /app/storage/shiftweave.db
      PRIVATE_KEY_PATH: /run/epic/private_key.pem
    volumes:
      - /mnt/shiftweave/storage:/app/storage
      - /mnt/shiftweave/backups:/app/backups
      - /mnt/shiftweave/keys:/run/epic:ro
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  https:
    image: caddy:2
    # Caddy needs only the domain, not the app's Bedrock/Epic/ElevenLabs secrets.
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the Compose --env-file}
    ports: ['80:80', '443:443']
    volumes:
      - /mnt/shiftweave/Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/shiftweave/caddy-data:/data
      - /mnt/shiftweave/caddy-config:/config
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
